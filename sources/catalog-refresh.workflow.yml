name: Refresh preview catalog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Registered source refresh scope
        type: choice
        options: [all, live, gear, reconcile]
        default: all
  schedule:
    - cron: '17 */3 * * *'
    - cron: '29 */6 * * *'
    - cron: '43 2 * * *'

permissions:
  contents: write

concurrency:
  group: preview-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted preview collector
        uses: actions/checkout@v4
        with:
          ref: preview
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore bounded collector cache and lastgood
        uses: actions/cache/restore@v4
        with:
          path: .collector
          key: collector-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: collector-
      - name: Verify collector and catalog contracts
        run: npm test
      - name: Refresh registered sources
        id: collect
        continue-on-error: true
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          mode=all
          case "$EVENT_SCHEDULE" in
            '17 */3 * * *') mode=live ;;
            '29 */6 * * *') mode=gear ;;
            '43 2 * * *') mode=reconcile ;;
          esac
          case "$REQUESTED_MODE" in
            all|live|gear|reconcile) mode="$REQUESTED_MODE" ;;
            '') ;;
            *) exit 1 ;;
          esac
          npm run collect -- --mode "$mode" --publish
      - name: Validate resulting static data
        run: |
          node scripts/build-admin-status.cjs
          npm test
      - name: Commit only preview data paths
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- dist/catalog.json dist/source-snapshot.json dist/collector-status.json dist/admin/status.json
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in
              dist/catalog.json|dist/source-snapshot.json|dist/collector-status.json|dist/admin/status.json) ;;
              *) exit 1 ;;
            esac
          done
          git commit -m 'Refresh preview catalog data'
          git push origin HEAD:preview
      - name: Preserve lastgood and refusal quarantine
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .collector
          key: collector-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report source failures without retrying
        if: steps.collect.outcome == 'failure'
        run: exit 1
