name: Refresh verified catalog

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Registered source refresh scope
        type: choice
        options: [all, live, gear, reconcile]
        default: all
  # Seven scheduled slots per UTC day: live 4, gear 2, reconcile 1.
  # GitHub may delay delivery; manual dispatches and retries are additional.
  schedule:
    - cron: '17 */6 * * *'
    - cron: '29 */12 * * *'
    - cron: '43 2 * * *'

permissions:
  contents: write

concurrency:
  group: preview-catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout trusted main collector
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Pin publication branches before collection
        shell: bash
        run: |
          git fetch origin main preview
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "MAIN_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "PREVIEW_BASE=$(git rev-parse origin/preview)" >> "$GITHUB_ENV"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Restore bounded collector cache and lastgood
        uses: actions/cache/restore@v4
        with:
          path: .collector
          key: collector-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: collector-
      - name: Verify collector and catalog contracts
        run: npm test
      - name: Refresh registered sources
        id: collect
        continue-on-error: true
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          mode=all
          case "$EVENT_SCHEDULE" in
            '17 */6 * * *') mode=live ;;
            '29 */12 * * *') mode=gear ;;
            '43 2 * * *') mode=reconcile ;;
          esac
          case "$REQUESTED_MODE" in
            all|live|gear|reconcile) mode="$REQUESTED_MODE" ;;
            '') ;;
            *) exit 1 ;;
          esac
          npm run collect -- --mode "$mode" --publish --quiet
      - name: Validate resulting static data
        run: |
          node scripts/build-admin-status.cjs
          npm test
      - name: Publish validated data to main and preview atomically
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/publish-catalog.cjs
      - name: Preserve lastgood and refusal quarantine
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .collector
          key: collector-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Report source failures without retrying
        if: steps.collect.outcome == 'failure'
        run: exit 1
