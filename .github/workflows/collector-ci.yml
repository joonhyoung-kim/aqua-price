name: Verify collector and catalog (read only)
on:
  push:
    branches:
      - 'fix/collector-product-refresh-deferrals'
  pull_request:
    branches: [main, preview]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify all collector and catalog contracts
        run: npm test
